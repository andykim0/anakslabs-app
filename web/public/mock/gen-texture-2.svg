    </linearGradient>
    <radialGradient id="mist" cx="0.4" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#8fa3b8" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#55677a" stop-opacity="0.12"/>
