<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face { font-family: "Daboim Smoke"; src: local("Apple SD Gothic Neo"); font-weight: 100 900; }
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #07142f; }
      body { font-family: "Daboim Smoke", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #fff; }
      .aura {
        position: absolute; inset: -25%;
        background: radial-gradient(circle at 68% 34%, rgba(104,232,216,.55), transparent 23%),
          radial-gradient(circle at 30% 72%, rgba(23,77,218,.72), transparent 32%), #07142f;
        animation: aura 3s linear both;
      }
      .grid {
        position: absolute; inset: 0; opacity: .2;
        background-image: linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
        background-size: 96px 96px;
        animation: grid 3s linear both;
      }
      .lockup {
        position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
        animation: lockup 3s cubic-bezier(.2,.8,.2,1) both;
      }
      .mark { width: 150px; height: 150px; margin-bottom: 34px; filter: drop-shadow(0 18px 42px rgba(0,0,0,.3)); }
      h1 { margin: 0; font-size: 150px; line-height: 1; letter-spacing: -.075em; font-weight: 800; word-break: keep-all; }
      p { margin: 30px 0 0; color: #68e8d8; font-size: 30px; font-weight: 650; letter-spacing: .18em; }
      @keyframes aura { 0% { transform: scale(1.18) rotate(-2deg); } 100% { transform: scale(1) rotate(2deg); } }
      @keyframes grid { 0% { transform: translate3d(0,70px,0); opacity: 0; } 32%,100% { transform: none; opacity: .2; } }
      @keyframes lockup {
        0%,10% { opacity: 0; transform: translate3d(0,70px,0) scale(.92); filter: blur(16px); }
        42%,82% { opacity: 1; transform: none; filter: blur(0); }
        100% { opacity: 0; transform: translate3d(0,-28px,0) scale(1.035); filter: blur(4px); }
      }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="daboim-smoke" data-no-timeline data-start="0" data-duration="3" data-fps="30" data-width="1920" data-height="1080">
      <div id="smoke-aura" class="clip aura" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="smoke-grid" class="clip grid" data-start="0" data-duration="3" data-track-index="1"></div>
      <section id="smoke-lockup" class="clip lockup" data-start="0" data-duration="3" data-track-index="2" aria-label="다보임 로고 타이포 등장">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
          <path fill="#68e8d8" d="M12 16h34c26 0 42 12 42 34S72 84 46 84H12V16Zm22 19v30h12c12 0 19-5 19-15s-7-15-19-15H34Z" />
          <circle cx="78" cy="22" r="8" fill="#fff" />
        </svg>
        <h1>다보임</h1>
        <p>HTML MOTION · EXACTLY RENDERED</p>
      </section>
    </main>
  </body>
</html>
